spring.application.name=tracking-service
server.port=8082

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.username=rotahub
spring.mongodb.password=rotahub
spring.mongodb.authentication-database=admin
spring.mongodb.database=rotahub_tracking
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rotahub
spring.rabbitmq.password=rotahub
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

rotahub.events.exchange=rotahub.events
rotahub.events.delivery-completed-routing-key=delivery.completed
rotahub.events.tracking-status-changed-routing-key=tracking.status-changed
