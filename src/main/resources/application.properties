spring.application.name=tracking-service
server.port=8082

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.username=rotahub
spring.mongodb.password=rotahub
spring.mongodb.authentication-database=admin
spring.mongodb.database=rotahub_tracking
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rotahub
spring.rabbitmq.password=rotahub

rotahub.events.exchange=rotahub.events
rotahub.events.delivery-completed-routing-key=delivery.completed
